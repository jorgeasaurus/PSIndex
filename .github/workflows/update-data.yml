name: Update data

# Replaces the per-repo workflows of MgGraphIndex, AzIndex, EntraIndex, ExchIndex,
# MecmIndex and ErrorIndex. Each source refreshes in its own job; one job commits
# the result, and the push triggers a Vercel deployment.

on:
  schedule:
    - cron: "17 5 * * *" # daily, cmdlet sources (errors run on the 3rd of each month)
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources to refresh (graph,az,entra,exchange,mecm,errors) or 'all'"
        default: all

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - id: pick
        shell: bash
        run: |
          want="${{ github.event.inputs.sources }}"
          if [ -z "$want" ] || [ "$want" = "all" ]; then
            want="graph,az,entra,exchange,mecm"
            # Errors scrape is slow and changes rarely: monthly on schedule, always on manual 'all'.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" = "03" ]; then want="$want,errors"; fi
          fi
          echo "sources=$(jq -cn --arg s "$want" '$s | split(",") | map(gsub("\\s";"")) | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream docs and parse
        shell: bash
        run: |
          set -euo pipefail
          sparse() { git clone --depth 1 --filter=blob:none --sparse "$1" "$2"; (cd "$2" && shift 2 && git sparse-checkout set "$@"); }
          case "${{ matrix.source }}" in
            graph)
              sparse https://github.com/MicrosoftDocs/microsoftgraph-docs-powershell.git docs \
                microsoftgraph/graph-powershell-1.0 microsoftgraph/graph-powershell-beta
              python3 pipelines/graph/parse_docs.py docs/microsoftgraph ;;
            az)
              git clone --depth 1 --filter=blob:none --sparse https://github.com/MicrosoftDocs/azure-docs-powershell.git docs
              (cd docs && git sparse-checkout set --no-cone 'azps-*/Az.*')
              python3 pipelines/az/parse_docs.py docs ;;
            entra)
              sparse https://github.com/MicrosoftDocs/entra-powershell-docs.git docs docs/reference/v1.0 docs/reference/beta
              python3 pipelines/entra/parse_docs.py docs/docs/reference ;;
            exchange)
              git clone --depth 1 https://github.com/MicrosoftDocs/office-docs-powershell.git docs
              python3 pipelines/exchange/parse_docs.py docs ;;
            mecm)
              sparse https://github.com/MicrosoftDocs/sccm-docs-powershell-ref.git docs sccm-ps/ConfigurationManager
              python3 pipelines/mecm/parse_docs.py docs ;;
            errors)
              python3 pipelines/errors/scrape_errors.py ;;
            *) echo "unknown source ${{ matrix.source }}"; exit 1 ;;
          esac
          rm -rf docs

      - name: Refuse partial refreshes
        run: python3 scripts/check-shrink.py ${{ matrix.source }}

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.source }}
          path: data/${{ matrix.source }}
          retention-days: 3

  commit:
    needs: refresh
    # Commit whatever refreshed cleanly, even if one source failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: refreshed

      - name: Apply refreshed sources
        shell: bash
        run: |
          shopt -s nullglob
          for dir in refreshed/data-*; do
            src="${dir#refreshed/data-}"
            rm -rf "data/$src" && mkdir -p "data/$src" && cp -r "$dir"/. "data/$src/"
            echo "applied $src"
          done

      - name: Commit
        shell: bash
        run: |
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          changed=$(git diff --cached --name-only | cut -d/ -f2 | sort -u | paste -sd, -)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(data): refresh ${changed}"
          git push
