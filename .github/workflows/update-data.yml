name: Update data

# Replaces the per-repo workflows of MgGraphIndex, AzIndex, EntraIndex, ExchIndex,
# and MecmIndex. Each source refreshes in its own job; one job commits
# the result, and the push triggers a Vercel deployment.

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to refresh, separated by commas or spaces (ids of pipelines/<id>/source.env), or 'all'"
        default: all

# One run at a time; a run started meanwhile waits. GitHub keeps one waiting run per group, so a
# newer dispatch replaces an older one still waiting: to refresh several sources, dispatch them
# together ("graph,mecm"), not one by one.
concurrency:
  group: update-data
  cancel-in-progress: false

# Read-only by default. Only the commit job may write, and only its push step holds a credential:
# its checkout keeps no token, so the install and build it runs over refreshed data cannot push.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        # The input arrives as data in the environment, never spliced into the script.
        env:
          WANT: ${{ github.event.inputs.sources }}
        run: |
          # Every pipelines/<source>/source.env is a source (build-index checks this matches SOURCES).
          known=$(ls pipelines/*/source.env | cut -d/ -f2 | paste -sd, -)
          # Ids may be separated by commas and/or any whitespace ("az mecm", one per line). Blank or
          # 'all' means every source; ' , ' has no ids and fails.
          sources=$(jq -cn --arg w "$WANT" --arg k "$known" '($k | split(",")) as $known
            | ([$w | ascii_downcase | splits("[,\\s]+") | select(length > 0)] | unique) as $ids
            | (if ($w | test("^\\s*$")) or $ids == ["all"] then $known else $ids end) as $want
            | ($want - $known) as $unknown
            | if ($unknown | length) > 0 then error("unknown sources: \($unknown | join(", ")); known: \($known | join(", "))")
              elif ($want | length) == 0 then error("no sources given; known: \($known | join(", "))")
              else $want end')
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream docs and parse
        run: bash pipelines/refresh.sh ${{ matrix.source }}

      - name: Refuse partial refreshes
        run: python3 scripts/check-shrink.py ${{ matrix.source }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The deploy builds the index from data/. Checking here, with the other sources as committed,
      # means a source the build would reject uploads nothing and the rest still commit.
      - name: Refuse data the index build rejects
        run: npm ci && npm run index

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.source }}
          path: data/${{ matrix.source }}
          retention-days: 3

  commit:
    needs: [plan, refresh]
    # Commit whatever refreshed cleanly, even if one source failed; with no plan there is nothing to commit.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: refreshed

      # Decide here, before the long verify, whether the refresh changed anything: most daily runs
      # find upstream unchanged and stop at this step.
      - name: Apply refreshed sources
        id: apply
        shell: bash
        run: |
          shopt -s nullglob
          applied=false
          for dir in refreshed/data-*; do
            src="${dir#refreshed/data-}"
            rm -rf "data/$src" && mkdir -p "data/$src" && cp -r "$dir"/. "data/$src/"
            echo "applied $src"
            applied=true
          done
          changed=false
          if [ "$applied" = false ]; then
            echo "::warning::No source refreshed cleanly; nothing to commit."
          elif [ -z "$(git status --porcelain -- data)" ]; then
            echo "::notice::Refreshed data is identical to ${GITHUB_REF_NAME}; skipping the build, tests and commit."
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # The push below uses GITHUB_TOKEN, which does not trigger ci.yml, yet Vercel deploys it.
      # So the combined refreshed data passes the same gate as a PR (npm run verify, which ci.yml
      # runs too); if upstream docs moved a cmdlet the suite relies on, nothing ships until fixed.
      - uses: actions/setup-node@v4
        if: steps.apply.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and test the refreshed site
        if: steps.apply.outputs.changed == 'true'
        run: npm ci && npm run verify

      - name: Commit
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        # The bot identity for the commit.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          changed=$(git diff --cached --name-only | cut -d/ -f2 | sort -u | paste -sd, -)
          git commit -m "chore(data): refresh ${changed}"
          # Push exactly the tree tested above. If main moved meanwhile the push is rejected (not a
          # fast-forward) and the run fails; the next run refreshes and tests against the new main.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
